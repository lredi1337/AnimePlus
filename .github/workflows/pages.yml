# Сайт на GitHub Pages: страница поддержки с формой (pages/index.html) и политика конфиденциальности из PRIVACY_POLICY.md.
# Адреса для Chrome Web Store: https://lredi1337.github.io/AnimePlus/ и https://lredi1337.github.io/AnimePlus/privacy/
# Pages отдаются с других серверов, чем github.com, поэтому открываются и когда сам сайт GitHub не отвечает.
# В настройках репозитория: Settings → Pages → Source: GitHub Actions
name: Pages

on:
  push:
    branches:
      - main
    paths:
      - PRIVACY_POLICY.md
      - pages/**
      - .github/workflows/pages.yml
      - modules/shared/tokens.css
      - icons/icon128.png
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Политика одна: страница собирается из того же файла, что лежит в репозитории
      - name: Политика конфиденциальности
        run: |
          {
            printf -- '---\ntitle: Политика конфиденциальности Anime+\npermalink: /privacy/\n---\n\n'
            cat PRIVACY_POLICY.md
          } > pages/privacy.md
      # Страница поддержки в тех же цветах, что расширение
      - name: Оформление и значок
        run: |
          cp modules/shared/tokens.css pages/tokens.css
          cp icons/icon128.png pages/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./pages
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
