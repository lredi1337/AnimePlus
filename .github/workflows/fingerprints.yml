# Ежедневное пополнение базы отпечатков песен в ветке fingerprints. Запускается сам, ваш компьютер не нужен.
name: Fingerprints

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fingerprints
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: fingerprints
          path: db
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build
        run: node tools/build-fingerprints.js --out db/v1 --ongoing 300 --top 3000 --limit-minutes 300
      - name: Publish
        working-directory: db
        run: |
          git config user.name "anime-plus-bot"
          git config user.email "anime-plus-bot@users.noreply.github.com"
          git add v1
          if git diff --cached --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Обновление базы отпечатков"
            git push
          fi
      # Сайт Cloudflare: запасной источник песен на случай отказа GitHub. Сбой здесь не отменяет обновление на GitHub.
      # Нужны секреты CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID, без них шаг пропускается
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node tools/build-songs-site.js db/v1 songs-site
          cat > wrangler.toml <<'EOF'
          name = "anime-plus-db"
          compatibility_date = "2026-10-01"
          workers_dev = true

          [assets]
          directory = "songs-site"
          not_found_handling = "404-page"
          EOF
          npx --yes wrangler@4 deploy
