# Ежедневное пополнение базы отпечатков песен в ветке fingerprints. Запускается сам, ваш компьютер не нужен.
name: Fingerprints

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fingerprints
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: fingerprints
          path: db
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build
        run: node tools/build-fingerprints.js --out db/v1 --ongoing 300 --top 3000 --limit-minutes 300
      - name: Publish
        working-directory: db
        run: |
          git config user.name "anime-plus-bot"
          git config user.email "anime-plus-bot@users.noreply.github.com"
          git add v1
          if git diff --cached --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Обновление базы отпечатков"
            git push
          fi
