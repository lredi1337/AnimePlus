# ESLint и все тесты на каждую отправку кода и запрос на слияние
name: Check

on:
  push:
    branches-ignore:
      - fingerprints
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
