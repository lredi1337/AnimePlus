<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Anime+</title>
    <link rel="stylesheet" href="notification.css">
</head>
<body>
    <div class="notif-window" id="notifWindow">
        <img id="notifPoster" class="notif-poster" src="icons/icon128.png" alt="poster">
        <div class="notif-content">
            <div class="notif-header">
                <span class="notif-badge" id="notifBadge">🔥 Вышла серия</span>
            </div>
            <div class="notif-title" id="notifTitle">Название аниме</div>
            <div class="notif-voiceovers" id="notifVoiceovers"></div>
            <div class="notif-btns" id="notifBtns"></div>
        </div>
    </div>
    <script src="notification.js"></script>
</body>
</html>
